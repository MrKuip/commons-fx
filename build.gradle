import java.nio.file.Files
import java.nio.file.Paths
import java.nio.file.StandardCopyOption

plugins {
  id 'java-library'
  id 'eclipse'
  id 'application'
}

group = "org.kku"
version = "1.0.1"

defaultTasks 'jar'

test
{
  useJUnitPlatform()
  outputs.upToDateWhen { false }
  testLogging {
    showStandardStreams = true 
    events "passed", "skipped", "failed"
    exceptionFormat "full"
  }
}


apply from: 'build-eclipse.gradle'

repositories {
  mavenCentral()
}

def osName = System.getProperty("os.name").toLowerCase()
def osArch = System.getProperty("os.arch").toLowerCase()
def isArm  = osArch.contains("aarch64") || osArch.contains("arm")

def fxClassifier =
    osName.contains("win") ? "win" :
    osName.contains("mac") ? (isArm ? "mac-aarch64" : "mac") :
                             (isArm ? "linux-aarch64" : "linux")

def fxVersion = "26"

java {
  sourceCompatibility = JavaVersion.VERSION_11
  targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    ['javafx-base', 'javafx-graphics', 'javafx-controls', 'javafx-media', 'javafx-web', 'javafx-swing'].each { m ->
    implementation "org.openjfx:$m:$fxVersion"
    implementation "org.openjfx:$m:$fxVersion:$fxClassifier"
  }
  implementation "org.openjfx:jdk-jsobject:$fxVersion"
  implementation "org.openjfx:jdk-jsobject:$fxVersion:$fxClassifier"

  implementation 'org.kku:iconify4j:1.0'
  implementation 'org.kku:commons-base:1.0.1'
  implementation 'com.miglayout:miglayout-javafx:11.5.2'

  testImplementation platform('org.junit:junit-bom:5.14.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
  mainClass.set('org.kku.fx.iconify.main.IconifyViewer');
  mainModule.set('org.kku.fx');
}
